
services:

  # ── Backend API ──
  backend:
    build: ./backend
    container_name: autoluxe-backend
    ports:
      - "3000:3000"
    restart: always

  # ── Frontend Website ──
  frontend:
    build: ./frontend
    container_name: autoluxe-frontend
    ports:
      - "8080:80"
    restart: always
    depends_on:
      - backend