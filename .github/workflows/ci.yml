# ── AutoLuxe Hub — CI/CD Pipeline ──
name: AutoLuxe Hub CI

# Run this pipeline on every push to any branch
on:
  push:
    branches:
      - main
      - AH-dev
  pull_request:
    branches:
      - main

jobs:

  # ── JOB 1 — Check the code ──
  lint:
    name: Check Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check frontend files exist
        run: |
          echo "Checking frontend files..."
          ls frontend/
          echo "✅ Frontend files found"

      - name: Check backend files exist
        run: |
          echo "Checking backend files..."
          ls backend/
          echo "✅ Backend files found"

  # ── JOB 2 — Test the backend ──
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd backend
          npm install

      - name: Check server file exists
        run: |
          echo "Checking server.js..."
          ls backend/server.js
          echo "✅ Server file found"

      - name: Check cars data exists
        run: |
          echo "Checking cars.json..."
          ls backend/cars.json
          echo "✅ Cars data found"

  # ── JOB 3 — Build Docker containers ──
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build frontend container
        run: |
          docker build ./frontend -t autoluxe-frontend
          echo "✅ Frontend container built"

      - name: Build backend container
        run: |
          docker build ./backend -t autoluxe-backend
          echo "✅ Backend container built"

      - name: Confirm both images exist
        run: |
          docker images
          echo "✅ All images ready"